services:
  - type: web
    name: instatern-instagram-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DB_PATH
        value: instagram.db
      - key: ALLOWED_CORS_ORIGINS
        value: https://instatern-instagram-app.onrender.com
