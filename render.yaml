services:
  - type: web
    name: instatern-instagram-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    envVars:
      - key: CYBER_ENGINE_URL
        sync: false
        value: https://cyber-engine.onrender.com
      - key: CYBER_ENGINE_API_KEY
        value: ce_live_test_api_key_secret_12345
      - key: TENANT_ID
        value: tenant-alpha
      - key: APP_ID
        value: instagram-app
      - key: SERVICE_ID
        value: instagram-api

