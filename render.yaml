services:
  - type: web
    name: instatern-instagram-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DB_PATH
        value: instagram.db
      - key: ALLOWED_CORS_ORIGINS
        value: https://instatern-instagram-app.onrender.com
      - key: TERNLINE_ENDPOINT
        value: http://13.211.144.111:8000
      - key: TERNLINE_APP_ID
        value: instagr-app
      - key: TERNLINE_SERVICE_ID
        value: instagr-tern
      - key: TERNLINE_API_KEY
        sync: false
      - key: TELEMETRY_ENABLED
        value: "true"
