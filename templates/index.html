<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

  <!-- App Header -->
  <header class="insta-header">
    <div class="header-container">
      <div class="logo-area">
        <span class="logo-text">{{ app_name }}</span>
      </div>

      <div class="search-box">
        <span class="search-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </span>
        <input type="text" id="searchInput" placeholder="Search creators & tags..." />
        <div id="searchResultsDropdown" class="search-dropdown" style="display:none;"></div>
      </div>

      <div class="nav-actions">
        <button class="nav-icon-btn" title="Home Feed" onclick="fetchFeed()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        </button>
        <button class="nav-icon-btn" title="Direct Messages" onclick="openMessagesModal()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
        <button class="nav-icon-btn" title="Create New Post" onclick="openCreatePostModal()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
        </button>
        <button class="nav-icon-btn" title="Add Story" onclick="openCreateStoryModal()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
        </button>
        <div class="user-pill" id="userPill">
          <span>Loading...</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Body Layout -->
  <main class="main-wrapper">
    <!-- Feed Column -->
    <div class="feed-column">
      <!-- Stories Bar -->
      <section class="stories-card" id="storiesContainer">
        <!-- Rendered via JS -->
      </section>

      <!-- Posts Feed -->
      <section class="feed-list" id="feedContainer">
        <!-- Rendered via JS -->
      </section>
    </div>

    <!-- Right Sidebar -->
    <aside class="sidebar-column">
      <div id="sidebarUserProfile">
        <!-- Rendered via JS -->
      </div>

      <div class="sidebar-card">
        <div class="sidebar-card-title">Explore Creators</div>
        <div id="suggestionsList" class="suggestions-list">
          <!-- Rendered via JS -->
        </div>
      </div>

      <div class="sidebar-footer">
        © 2026 {{ app_name }} &bull; Privacy &bull; Terms
      </div>
    </aside>
  </main>

  <!-- Create Post Modal -->
  <div class="modal-overlay" id="createPostModal">
    <div class="modal-box">
      <div class="modal-header">
        <strong>Create New Post</strong>
        <button class="nav-icon-btn" onclick="closeCreatePostModal()">✕</button>
      </div>
      <form id="createPostForm" style="display:flex; flex-direction:column; gap:12px;">
        <div class="form-group">
          <label>Image URL</label>
          <input type="url" id="newPostImage" required placeholder="https://images.unsplash.com/..." value="https://images.unsplash.com/photo-1510519138197-06b8f2a09616?w=900&auto=format&fit=crop" />
        </div>
        <div class="form-group">
          <label>Caption</label>
          <textarea id="newPostCaption" rows="3" required placeholder="Write a caption..."></textarea>
        </div>
        <div class="form-group">
          <label>Tags (comma-separated)</label>
          <input type="text" id="newPostTags" placeholder="design, architecture, life" value="lifestyle, moment" />
        </div>
        <button type="submit" class="btn-primary" style="margin-top:6px;">Share Post</button>
      </form>
    </div>
  </div>

  <!-- Create Story Modal -->
  <div class="modal-overlay" id="createStoryModal">
    <div class="modal-box">
      <div class="modal-header">
        <strong>Add to Your Story</strong>
        <button class="nav-icon-btn" onclick="closeCreateStoryModal()">✕</button>
      </div>
      <form id="createStoryForm" style="display:flex; flex-direction:column; gap:12px;">
        <div class="form-group">
          <label>Story Media URL</label>
          <input type="url" id="newStoryMedia" required placeholder="https://images.unsplash.com/..." value="https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=600&auto=format&fit=crop" />
        </div>
        <button type="submit" class="btn-primary">Publish Story</button>
      </form>
    </div>
  </div>

  <!-- Direct Messages Modal -->
  <div class="modal-overlay" id="messagesModal">
    <div class="modal-box" style="max-width: 650px;">
      <div class="modal-header">
        <strong>Direct Messages</strong>
        <button class="nav-icon-btn" onclick="closeMessagesModal()">✕</button>
      </div>
      <div style="display:grid; grid-template-columns: 200px 1fr; gap:16px; min-height: 350px;">
        <!-- Left: Conversations List -->
        <div id="conversationsList" style="border-right: 1px solid var(--border-color); padding-right:12px; display:flex; flex-direction:column; gap:8px;">
          <!-- Rendered via JS -->
        </div>

        <!-- Right: Message Thread -->
        <div style="display:flex; flex-direction:column; justify-content:space-between;">
          <div id="threadHeader" style="font-size:13px; font-weight:700; padding-bottom:8px; border-bottom:1px solid var(--border-color);">
            <span>Select a conversation or start a new chat</span>
          </div>
          <div id="messagesContent" style="flex:1; overflow-y:auto; max-height:260px; padding:10px 0; display:flex; flex-direction:column; gap:8px;">
            <div style="color:var(--text-dim); font-size:12px; text-align:center; margin-top:20px;">No conversation selected</div>
          </div>
          <div style="display:flex; gap:8px; padding-top:8px; border-top:1px solid var(--border-color);">
            <input type="text" id="dmInput" placeholder="Message..." style="flex:1; background:var(--panel-bg); border:1px solid var(--border-color); border-radius:8px; padding:8px; color:var(--text-main); font-size:12px;" onkeydown="if(event.key==='Enter') sendCurrentDM()" />
            <button class="btn-primary" style="padding:6px 12px; font-size:12px;" onclick="sendCurrentDM()">Send</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
